[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/predict"
  to = "/.netlify/functions/predict"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.{html,js,css}"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
